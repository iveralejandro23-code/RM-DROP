<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RIVER Admin | Julián Reynoso Store</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#090909;color:#fff;font-family:Arial,Helvetica,sans-serif}
    .login-card{width:min(430px,calc(100% - 34px));padding:34px;background:#151515;border:1px solid #292929;box-shadow:0 18px 60px rgba(0,0,0,.35)}
    .kicker{font-size:10px;letter-spacing:2.5px;color:#9c9c9c;font-weight:700}
    h1{margin:8px 0 6px;font-size:31px;text-transform:uppercase}
    .sub{margin:0 0 25px;color:#aaa;line-height:1.5;font-size:13px}
    label{display:block;margin:14px 0 7px;font-size:11px;text-transform:uppercase;font-weight:700;letter-spacing:.5px}
    input{width:100%;padding:13px 14px;background:#0d0d0d;border:1px solid #373737;color:#fff;font:inherit}
    button{width:100%;margin-top:19px;padding:14px;border:0;background:#f3efe4;color:#111;font-weight:800;cursor:pointer;text-transform:uppercase}
    button:disabled{opacity:.55;cursor:not-allowed}.message{min-height:18px;margin-top:14px;font-size:12px;color:#e0abab}
    .ok{color:#9bd5a7}
  </style>
</head>
<body>
  <form class="login-card" id="loginForm">
    <div class="kicker">RIVER ADMIN</div>
    <h1>Julián Reynoso Store</h1>
    <p class="sub">Acceso privado al panel administrativo.</p>
    <label for="email">Correo</label>
    <input id="email" type="email" autocomplete="username" required>
    <label for="password">Contraseña</label>
    <input id="password" type="password" autocomplete="current-password" required>
    <button id="loginBtn" type="submit">Entrar</button>
    <div class="message" id="message"></div>
  </form>

  <script src="config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const cfg = window.RIVER_CONFIG || {};
    const client = window.supabase.createClient(cfg.SUPABASE_URL, cfg.SUPABASE_ANON_KEY);
    const form = document.getElementById("loginForm");
    const message = document.getElementById("message");
    const btn = document.getElementById("loginBtn");

    (async () => {
      const { data } = await client.auth.getSession();
      if (data.session) {
        const { data: isAdmin, error } = await client.rpc("is_admin");
        if (!error && isAdmin === true) location.replace("admin.html");
      }
    })();

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      message.className = "message";
      message.textContent = "Verificando acceso...";
      btn.disabled = true;

      const { error } = await client.auth.signInWithPassword({
        email: document.getElementById("email").value.trim(),
        password: document.getElementById("password").value
      });

      if (error) {
        message.textContent = "No se pudo iniciar sesión. Revisa correo y contraseña.";
        btn.disabled = false;
        return;
      }

      const { data: isAdmin, error: adminError } = await client.rpc("is_admin");
      if (adminError || isAdmin !== true) {
        await client.auth.signOut();
        message.textContent = "Este usuario no tiene permiso de administrador.";
        btn.disabled = false;
        return;
      }

      message.className = "message ok";
      message.textContent = "Acceso correcto.";
      location.replace("admin.html");
    });
  </script>
</body>
</html>
