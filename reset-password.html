<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ROCKSTAR Admin · Nueva contraseña</title>
  <link rel="stylesheet" href="admin.css">
</head>
<body class="rockstar-reset-page">
  <main class="rockstar-reset-card">
    <p class="eyebrow">ROCKSTAR ADMIN</p>
    <h1>Nueva contraseña</h1>
    <p>Escribe la nueva contraseña para tu cuenta de administrador.</p>
    <label>NUEVA CONTRASEÑA
      <input id="resetPassword" type="password" minlength="8" autocomplete="new-password">
    </label>
    <label>CONFIRMAR CONTRASEÑA
      <input id="resetPasswordConfirm" type="password" minlength="8" autocomplete="new-password">
    </label>
    <button id="resetPasswordButton" class="primary" type="button">Guardar nueva contraseña</button>
    <p id="resetPasswordMessage"></p>
  </main>
  <script src="config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="reset-password.js"></script>
</body>
</html>
